name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching the desktop version, for example v0.3.0"
        required: true
        type: string
      audit_only:
        description: "Audit an existing draft without rebuilding installers"
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Test and validate release
    if: github.event_name != 'workflow_dispatch' || inputs.audit_only != true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      POSTGRES_DB: legal_rag_test
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql+asyncpg://legal_rag:ci-postgres-password@localhost:5432/legal_rag_test
      TEST_DATABASE_URL: postgresql+asyncpg://legal_rag:ci-postgres-password@localhost:5432/legal_rag_test
      QDRANT_URL: http://localhost:6333
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-minio-user
      S3_SECRET_ACCESS_KEY: ci-minio-password
      LEGAL_KB_ROOT: data/legal_kb
      JOB_WORKER_ENABLED: "false"
      WARM_QUERY_MODELS_ON_STARTUP: "false"
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install OCR runtime
        run: sudo apt-get update && sudo apt-get install --yes tesseract-ocr

      - name: Check release version
        run: python scripts/check_release_version.py --tag "$RELEASE_TAG"

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
        working-directory: backend

      - name: Start integration-test services
        run: >-
          docker compose --env-file .env.example
          -f docker/docker-compose.yml -f docker/docker-compose.ci.yml
          up -d --wait postgres qdrant s3mock

      - name: Apply database migrations
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Create Qdrant collections
        # The cross-tenant tests index evidence into the private collections.
        run: python -m app.ingestion.init_qdrant
        working-directory: backend

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-bge-m3-${{ runner.os }}

      - name: Initialize S3-compatible storage buckets
        run: python -m app.ingestion.init_storage
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest -q
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend static export
        run: npm run build
        working-directory: frontend

  build-release:
    name: Build ${{ matrix.label }}
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.audit_only != true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each target ships exactly one installer, under a name a person can
          # pick without knowing what aarch64 or nsis means.
          - label: macOS arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
            installer_glob: dmg/*.dmg
            asset_suffix: Mac-Apple-Silicon.dmg
          - label: macOS x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
            installer_glob: dmg/*.dmg
            asset_suffix: Mac-Intel.dmg
          - label: Windows x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            installer_glob: nsis/*-setup.exe
            asset_suffix: Windows-Setup.exe
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build output
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Require updater signing material
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required to build verifiable updater artifacts." >&2
            exit 1
          fi
          if [ -z "$TAURI_UPDATER_PUBLIC_KEY" ]; then
            echo "TAURI_UPDATER_PUBLIC_KEY is required to configure updater verification." >&2
            exit 1
          fi

      - name: Create ephemeral updater configuration
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/create_tauri_release_config.mjs frontend/ci-release-config.json

      - name: Build signed bundles
        # Build only. The release is created by publish-draft, which uploads the
        # three installers and nothing else: no updater archives, signatures or
        # latest.json, so installed copies update by downloading a new installer.
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          retryAttempts: 2
          args: >-
            --target ${{ matrix.rust_target }}
            --bundles ${{ matrix.bundles }}
            --config ci-release-config.json

      - name: Name the installer
        shell: bash
        run: |
          shopt -s nullglob
          found=(frontend/src-tauri/target/${{ matrix.rust_target }}/release/bundle/${{ matrix.installer_glob }})
          if [ "${#found[@]}" -ne 1 ]; then
            echo "Expected one installer for ${{ matrix.label }}, found ${#found[@]}: ${found[*]}" >&2
            exit 1
          fi
          mkdir -p installer
          cp "${found[0]}" "installer/Corpusil-${RELEASE_TAG#v}-${{ matrix.asset_suffix }}"
          ls -l installer

      - name: Keep the installer for the release
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.rust_target }}
          path: installer/
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    name: Create draft release
    needs: build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Create the draft with the installers only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            title="$(head -n 1 "$notes" | sed 's/^# *//')"
            tail -n +2 "$notes" > release-notes.md
          else
            title="Corpusil ${version}"
            echo "Desktop installers for Corpusil ${version}." > release-notes.md
          fi
          ls -l installers
          gh release create "$RELEASE_TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$title" \
            --notes-file release-notes.md \
            --verify-tag

  verify-draft:
    name: Verify draft release assets
    needs: publish-draft
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.audit_only == true) ||
      needs.publish-draft.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      # GitHub hides unpublished draft releases from read-only installation
      # tokens. Write scope is required to resolve the draft; this job performs
      # only read operations and never publishes or mutates it.
      contents: write
    steps:
      - name: Verify release remains draft and updater assets exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub's releases/tags endpoint excludes drafts, so enumerate the
          # authenticated releases list and select the requested tag explicitly.
          release_json="$(
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)] | first'
          )"
          if [ -z "$release_json" ] || [ "$release_json" = "null" ]; then
            echo "Draft release ${RELEASE_TAG} was not found." >&2
            exit 1
          fi

          release_is_draft="$(jq -r '.draft' <<<"$release_json")"
          if [ "$release_is_draft" != "true" ]; then
            echo "Release must remain a draft until manual acceptance." >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          expected="$(printf '%s\n' \
            "Corpusil-${version}-Mac-Apple-Silicon.dmg" \
            "Corpusil-${version}-Mac-Intel.dmg" \
            "Corpusil-${version}-Windows-Setup.exe" | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Draft release must hold exactly the three installers." >&2
            echo "Expected:" >&2; echo "$expected" >&2
            echo "Found:" >&2; echo "$actual" >&2
            exit 1
          fi

          echo "Draft release holds exactly the three installers:"
          echo "$actual"
