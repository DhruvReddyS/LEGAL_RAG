name: CI

# The release workflow also runs this suite, but only on a version tag. That
# is the worst moment to discover a regression, so run the same gates on every
# pull request and on main. Release-specific steps (version/tag checks,
# installer builds) stay in release.yml.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  backend:
    name: Correctness (does the code do what it was told)
    runs-on: ubuntu-24.04
    env:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql+asyncpg://legal_rag:ci-postgres-password@localhost:5432/legal_rag
      QDRANT_URL: http://localhost:6333
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-minio-user
      S3_SECRET_ACCESS_KEY: ci-minio-password
      LEGAL_KB_ROOT: ../data/legal_kb
      # Services are provisioned below, so an unreachable dependency is a
      # failure here rather than a silent skip.
      RUN_INTEGRATION: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
        working-directory: backend

      - name: Start integration-test services
        run: >-
          docker compose --env-file .env.example -f docker/docker-compose.yml
          up -d --wait postgres qdrant minio

      - name: Apply database migrations
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Initialize S3-compatible storage buckets
        run: python -m app.ingestion.init_storage
        working-directory: backend

      - name: Verify retrieval health
        # Silent failure modes: a stale instruction prefix, an asymmetric
        # query/document path, a normalisation/distance mismatch, a 512-token
        # truncation. None of these raise; all degrade retrieval.
        run: python scripts/verify_retrieval_health.py --json retrieval-health.json

      - name: Run correctness tests
        # The cross-tenant suite is reported as its own job below. Conflating
        # them hides which kind of failure occurred: "the code misbehaved" and
        # "a caller reached another tenant's evidence" need different responses.
        run: python -m pytest -q -m "not redteam"
        working-directory: backend

      - name: Upload retrieval health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-health
          path: retrieval-health.json
          if-no-files-found: ignore

      - name: Report service logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 100


  security:
    name: Security (cross-tenant red team)
    runs-on: ubuntu-24.04
    env:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql+asyncpg://legal_rag:ci-postgres-password@localhost:5432/legal_rag
      QDRANT_URL: http://localhost:6333
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-minio-user
      S3_SECRET_ACCESS_KEY: ci-minio-password
      LEGAL_KB_ROOT: ../data/legal_kb
      RUN_INTEGRATION: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
        working-directory: backend

      - name: Cache the embedding model
        # These tests embed for real. A fake retrieval service would prove the
        # authorisation decision is right while leaving a wrong Qdrant filter
        # undetected, which is the failure that actually leaks evidence.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-bge-m3-${{ runner.os }}

      - name: Start integration-test services
        run: >-
          docker compose --env-file .env.example -f docker/docker-compose.yml
          up -d --wait postgres qdrant minio

      - name: Apply database migrations
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Create Qdrant collections
        # The private case collections must exist before evidence is indexed
        # into them.
        run: python -m app.ingestion.init_qdrant
        working-directory: backend

      - name: Initialize S3-compatible storage buckets
        run: python -m app.ingestion.init_storage
        working-directory: backend

      - name: Run cross-tenant red-team suite
        run: python -m pytest -q -m redteam --junit-xml=redteam-results.xml
        working-directory: backend

      - name: Upload red-team results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results
          path: backend/redteam-results.xml
          if-no-files-found: ignore

      - name: Report service logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 100


  quality:
    name: Quality (does retrieval find the right law)
    # Needs an indexed corpus, which a fresh CI runner does not have: the
    # containers start empty. Run it where a corpus exists -- a self-hosted
    # runner, or manually against a restored snapshot. Wiring it to every push
    # against an empty index would fail for a reason that has nothing to do
    # with the change under review, and a gate that cries wolf gets disabled.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql+asyncpg://legal_rag:ci-postgres-password@localhost:5432/legal_rag
      QDRANT_URL: http://localhost:6333
      LEGAL_KB_ROOT: ../data/legal_kb
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
        working-directory: backend

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-bge-m3-${{ runner.os }}

      - name: Measure retrieval quality against the golden set
        run: >-
          python scripts/evaluate_retrieval.py
          --configs dense sparse hybrid reranked
          --out eval-result.json

      - name: Fail on a quality regression
        # The gate that makes the verification architecture a defended
        # property rather than a claim: a change that improves latency and
        # quietly costs recall or citation accuracy stops being mergeable.
        run: python scripts/check_quality_gate.py --result eval-result.json

      - name: Upload evaluation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality
          path: eval-result.json
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build static export
        run: npm run build
        working-directory: frontend
