name: CI

# The release workflow also runs this suite, but only on a version tag. That
# is the worst moment to discover a regression, so run the same gates on every
# pull request and on main. Release-specific steps (version/tag checks,
# installer builds) stay in release.yml.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    env:
      POSTGRES_DB: legal_rag
      POSTGRES_USER: legal_rag
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql+asyncpg://legal_rag:ci-postgres-password@localhost:5432/legal_rag
      QDRANT_URL: http://localhost:6333
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-minio-user
      S3_SECRET_ACCESS_KEY: ci-minio-password
      LEGAL_KB_ROOT: ../data/legal_kb
      # Services are provisioned below, so an unreachable dependency is a
      # failure here rather than a silent skip.
      RUN_INTEGRATION: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
        working-directory: backend

      - name: Start integration-test services
        run: >-
          docker compose --env-file .env.example -f docker/docker-compose.yml
          up -d --wait postgres qdrant minio

      - name: Apply database migrations
        run: python -m alembic upgrade head
        working-directory: backend

      - name: Initialize S3-compatible storage buckets
        run: python -m app.ingestion.init_storage
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest -q
        working-directory: backend

      - name: Report service logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 100

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Build static export
        run: npm run build
        working-directory: frontend
