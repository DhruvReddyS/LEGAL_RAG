[package]
name = "legal-rag-desktop"
version = "0.2.0"
description = "Multi-Agent Legal RAG desktop application"
authors = ["Legal RAG Project"]
edition = "2021"

[lib]
name = "legal_rag_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
