    <rect x="372" y="446" width="280" height="34" rx="4"/>
    <rect x="398" y="492" width="32" height="142" rx="5"/>
    <rect x="463" y="492" width="32" height="142" rx="5"/>
    <rect x="528" y="492" width="32" height="142" rx="5"/>
    <rect x="593" y="492" width="32" height="142" rx="5"/>
    <rect x="382" y="634" width="260" height="24" rx="4"/>
    <rect x="368" y="664" width="288" height="22" rx="4"/>
