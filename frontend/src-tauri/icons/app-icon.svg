    <linearGradient id="bronze" x1="380" y1="350" x2="650" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9743C"/>
      <stop offset="1" stop-color="#7A4F28"/>
    </linearGradient>
  </defs>

  <rect x="36" y="36" width="952" height="952" rx="230" fill="#FAF6EF"/>
  <rect x="36" y="36" width="952" height="952" rx="230" fill="none" stroke="#152420" stroke-opacity=".15" stroke-width="3"/>

  <circle cx="512" cy="512" r="266" fill="none" stroke="#152420" stroke-width="68"/>

  <g fill="url(#bronze)">
