-size="7.5" font-weight="700" fill="#028090">ANY ROLE, EITHER CLIENT</text><rect x="1035" y="124" width="254.99999999999997" height="56.00000000000001" rx="5" fill="#fff" stroke="#028090" stroke-width="1.3"/><text x="1044" y="146" font-family="Calibri" font-size="10.5" font-weight="700" fill="#028090">FastAPI Gateway</text><text x="1044" y="162" font-family="Calibri" font-size="8" fill="#6B7280">15 routers · JWT + RBAC</text><rect x="95" y="248" width="235" height="48" rx="5" fill="#fff" stroke="#2C5F2D" stroke-width="1.3"/><text x="104" y="270" font-family="Calibri" font-size="10.5" font-weight="700" fill="#2C5F2D">Document Analysis Agent</text><text x="104" y="286" font-family="Calibri" font-size="8" fill="#6B7280">uploaded PDF → facts</text><rect x="345" y="248" width="235" height="48" rx="5" fill="#fff" stroke="#2C5F2D" stroke-width="1.3"/><text x="354" y="270" font-family="Calibri" font-size="10.5" font-weight="700" fill="#2C5F2D">Drafting Agent</text><text x="354" y="286" font-family="Calibri" font-size="8" fill="#6B7280">FIR · notice · petition</text><rect x="595" y="248" width="235" height="48" rx="5" fill="#fff" stroke="#2C5F2D" stroke-width="1.3"/><text x="604" y="270" font-family="Calibri" font-size="10.5" font-weight="700" fill="#2C5F2D">Timeline Agent</text><text x="604" y="286" font-family="Calibri" font-size="8" fill="#6B7280">events · statutory clocks</text><rect x="844.9999999999999" y="248" width="235" height="48" rx="5" fill="#fff" stroke="#2C5F2D" stroke-width="1.3"/><text x="853.9999999999999" y="270" font-family="Calibri" font-size="10.5" font-weight="700" fill="#2C5F2D">Defence Strategy Agent</text><text x="853.9999999999999" y="286" font-family="Calibri" font-size="8" fill="#6B7280">arguments for the advocate</text><rect x="95" y="304" width="235" height="48" rx="5" fill="#fff" stroke="#2C5F2D" stroke-width="1.3"/><text x="104" y="326" font-family="Calibri" font-size="10.5" font-weight="700" fill="#2C5F2D">Compliance Agent</text><text x="104"