name: multi-agent-legal-rag

services:
  postgres:
    image: postgres:16.13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_rag}
      POSTGRES_USER: ${POSTGRES_USER:-legal_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_rag_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legal_rag_network

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legal_rag_network

  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://127.0.0.1:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legal_rag_network

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      S3_CORPUS_BUCKET: ${S3_CORPUS_BUCKET:-legal-rag-corpus}
      S3_POLICE_BUCKET: ${S3_POLICE_BUCKET:-legal-rag-police}
      S3_ADVOCATE_BUCKET: ${S3_ADVOCATE_BUCKET:-legal-rag-advocate}
      S3_GENERATED_BUCKET: ${S3_GENERATED_BUCKET:-legal-rag-generated}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing --with-versioning local/"$${S3_CORPUS_BUCKET}"
        mc mb --ignore-existing --with-versioning local/"$${S3_POLICE_BUCKET}"
        mc mb --ignore-existing --with-versioning local/"$${S3_ADVOCATE_BUCKET}"
        mc mb --ignore-existing --with-versioning local/"$${S3_GENERATED_BUCKET}"
    networks:
      - legal_rag_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://advocate.localhost:3000,http://admin.localhost:3000,http://127.0.0.1:3000,http://127.0.0.2:3000,http://tauri.localhost,tauri://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legal_rag}:${POSTGRES_PASSWORD:-legal_rag_dev_only}@postgres:5432/${POSTGRES_DB:-legal_rag}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      QDRANT_DENSE_VECTOR_NAME: ${QDRANT_DENSE_VECTOR_NAME:-dense}
      QDRANT_SPARSE_VECTOR_NAME: ${QDRANT_SPARSE_VECTOR_NAME:-sparse}
      QUERY_EMBEDDING_CACHE_SIZE: ${QUERY_EMBEDDING_CACHE_SIZE:-256}
      FAST_CANDIDATE_LIMIT: ${FAST_CANDIDATE_LIMIT:-8}
      FAST_RESULT_LIMIT: ${FAST_RESULT_LIMIT:-4}
      FAST_LATENCY_TARGET_MS: ${FAST_LATENCY_TARGET_MS:-5000}
      DEEP_LATENCY_TARGET_MS: ${DEEP_LATENCY_TARGET_MS:-60000}
      WARM_QUERY_MODELS_ON_STARTUP: ${WARM_QUERY_MODELS_ON_STARTUP:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-14b-40k:latest}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-legal-rag-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_CORPUS_BUCKET: ${S3_CORPUS_BUCKET:-legal-rag-corpus}
      S3_POLICE_BUCKET: ${S3_POLICE_BUCKET:-legal-rag-police}
      S3_ADVOCATE_BUCKET: ${S3_ADVOCATE_BUCKET:-legal-rag-advocate}
      S3_GENERATED_BUCKET: ${S3_GENERATED_BUCKET:-legal-rag-generated}
      LEGAL_KB_ROOT: ${LEGAL_KB_ROOT:-/data/legal_kb}
      HF_HOME: ${HF_HOME:-/data/legal_kb/cache/models}
    volumes:
      - ../data/legal_kb:/data/legal_kb
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      qdrant:
        condition: service_healthy
        restart: true
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - legal_rag_network

  ollama:
    image: ollama/ollama:0.30.8
    profiles:
      - llm
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - legal_rag_network

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  ollama_data:

networks:
  legal_rag_network:
    driver: bridge
